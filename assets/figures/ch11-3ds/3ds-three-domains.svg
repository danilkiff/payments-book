<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 214" width="385pt" height="214pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Домены -->
<g>
  <rect x="2" y="2" width="125" height="140" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.5"/>
  <text x="64.5" y="14" text-anchor="middle" font-size="9" font-weight="bold">Домен эквайера</text>
</g>
<g>
  <rect x="130" y="2" width="125" height="140" rx="3" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.5"/>
  <text x="192.5" y="14" text-anchor="middle" font-size="9" font-weight="bold">Домен интеграции</text>
</g>
<g>
  <rect x="258" y="2" width="125" height="140" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.5"/>
  <text x="320.5" y="14" text-anchor="middle" font-size="9" font-weight="bold">Домен эмитента</text>
</g>

<!-- Компоненты -->
<g>
  <rect x="14" y="22" width="100" height="24" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="64" y="32" text-anchor="middle" font-size="8" font-weight="bold">3DS Requestor</text>
  <text x="64" y="41" text-anchor="middle" font-size="7" fill="#5C647A">ТСП / PSP</text>
</g>
<g>
  <rect x="14" y="64" width="100" height="48" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="64" y="86" text-anchor="middle" font-size="8" font-weight="bold">3DS Server</text>
  <text x="64" y="95" text-anchor="middle" font-size="7" fill="#5C647A">AReq / RReq</text>
</g>
<g>
  <rect x="152" y="64" width="81" height="48" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="192.5" y="86" text-anchor="middle" font-size="8" font-weight="bold">DS</text>
  <text x="192.5" y="95" text-anchor="middle" font-size="7" fill="#5C647A">Directory Server</text>
</g>
<g>
  <rect x="271" y="64" width="100" height="48" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="321" y="86" text-anchor="middle" font-size="8" font-weight="bold">ACS</text>
  <text x="321" y="95" text-anchor="middle" font-size="7" fill="#5C647A">Access Control Server</text>
</g>
<g>
  <rect x="271" y="22" width="100" height="24" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="321" y="37" text-anchor="middle" font-size="8" font-weight="bold">Эмитент</text>
</g>
<g>
  <rect x="132" y="190" width="121" height="22" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="192.5" y="204" text-anchor="middle" font-size="8" font-weight="bold">Браузер / SDK держателя</text>
</g>

<!-- Связи внутри доменов -->
<line x1="64" y1="46" x2="64" y2="63" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
<g>
  <line x1="321" y1="46" x2="321" y2="63" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="325" y="57" font-size="7" fill="#5C647A">риск/решение</text>
</g>

<!-- AReq: 3DS Server -> DS -> ACS -->
<g>
  <line x1="114" y1="76" x2="151" y2="76" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <line x1="233" y1="76" x2="270" y2="76" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="141" y="73" text-anchor="middle" font-size="7" fill="#5C647A">AReq</text>
  <text x="244.5" y="73" text-anchor="middle" font-size="7" fill="#5C647A">AReq</text>
</g>
<!-- ARes: ACS -> DS -> 3DS Server -->
<g>
  <line x1="271" y1="90" x2="234" y2="90" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <line x1="152" y1="90" x2="115" y2="90" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="141" y="87" text-anchor="middle" font-size="7" fill="#5C647A">ARes</text>
  <text x="244.5" y="87" text-anchor="middle" font-size="7" fill="#5C647A">ARes</text>
</g>
<!-- RReq: ACS -> DS -> 3DS Server -->
<g>
  <line x1="271" y1="104" x2="234" y2="104" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <line x1="152" y1="104" x2="115" y2="104" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="244.5" y="101" text-anchor="middle" font-size="7" fill="#5C647A">RReq</text>
</g>
<g>
  <text x="192.5" y="125" text-anchor="middle" font-size="7" fill="#5C647A">RRes возвращается</text>
  <text x="192.5" y="134" text-anchor="middle" font-size="7" fill="#5C647A">тем же путём через DS</text>
</g>

<!-- 3DS Method URL: ACS -> браузер -->
<g>
  <path d="M 285,112 L 285,160 L 170,160 L 170,189" fill="none" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="165" y="170" text-anchor="end" font-size="8">3DS Method URL</text>
  <text x="165" y="179" text-anchor="end" font-size="7" fill="#5C647A">(отпечаток устройства, до AReq)</text>
</g>

<!-- Канал вызова CReq/CRes -->
<g>
  <path d="M 320,112 L 320,170 L 215,170 L 215,189" fill="none" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="323" y="152" font-size="8">CReq</text>
</g>
<g>
  <path d="M 235,190 L 235,180 L 355,180 L 355,113" fill="none" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="358" y="152" font-size="8">CRes</text>
</g>
<g>
  <text x="262" y="198" font-size="7" fill="#5C647A">канал вызова</text>
  <text x="262" y="207" font-size="7" fill="#5C647A">между ACS и устройством</text>
</g>

</g>
</svg>
