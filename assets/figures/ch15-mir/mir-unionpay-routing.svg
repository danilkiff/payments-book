  <text x="192.5" y="23.46" text-anchor="middle" font-size="7" fill="#5C647A">Mir Credit · A0 00 00 06 58 10 10 · tag 87 = 01</text>
  <text x="192.5" y="31.96" text-anchor="middle" font-size="7" fill="#5C647A">UnionPay Credit · A0 00 00 03 33 01 01 02 · tag 87 = 02</text>
</g>

<!-- A · Mir выбран -->
<g>
  <line x1="120" y1="40.5" x2="64" y2="61.5" stroke="#4E63D9" stroke-width="1" marker-end="url(#arr-AccentA)"/>
</g>
<g>
  <rect x="2" y="62" width="124" height="56" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="64" y="74" text-anchor="middle" font-size="8" font-weight="bold">A · Mir выбран</text>
  <text x="8" y="86" font-size="7" font-weight="bold" fill="#5C647A">Маршрут</text>
  <text x="8" y="97" font-size="8">ОПКЦ НСПК</text>
  <text x="8" y="108" font-size="7" fill="#5C647A">обычно — операция в РФ</text>
</g>

<!-- B · UnionPay выбран -->
<g>
  <line x1="192.5" y1="40.5" x2="194" y2="61.5" stroke="#7759D6" stroke-width="1" marker-end="url(#arr-AccentB)"/>
</g>
<g>
  <rect x="130" y="62" width="128" height="56" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="194" y="74" text-anchor="middle" font-size="8" font-weight="bold">B · UnionPay выбран</text>
  <text x="136" y="86" font-size="7" font-weight="bold" fill="#5C647A">Маршрут</text>
