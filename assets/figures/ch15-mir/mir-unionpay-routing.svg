  <text x="136" y="108" font-size="7" fill="#5C647A">обычно — операция за рубежом</text>
</g>

<!-- C · Пустой candidate list -->
<g>
  <line x1="265" y1="40.5" x2="322.5" y2="61.5" stroke="#C15462" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Bad)"/>
</g>
<g>
  <rect x="262" y="62" width="121" height="56" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
