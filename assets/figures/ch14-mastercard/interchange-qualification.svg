<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 184" width="385pt" height="184pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
  <marker id="arr-Good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F8B67"/></marker>
  <marker id="arr-Bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C15462"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">
<text x="2" y="9" font-size="8" fill="#5C647A">Категории квалификации (применяются одновременно):</text>

<!-- Регион -->
<g>
  <rect x="2" y="15" width="50" height="26" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="27" y="25.99" text-anchor="middle" font-size="8" font-weight="bold">Регион</text>
  <text x="27" y="34.71" text-anchor="middle" font-size="7" fill="#5C647A">US / EU / IC</text>
</g>

<!-- Продукт -->
<g>
  <rect x="53.5" y="15" width="88" height="26" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="97.5" y="25.99" text-anchor="middle" font-size="8" font-weight="bold">Продукт</text>
  <text x="97.5" y="34.71" text-anchor="middle" font-size="7" fill="#5C647A">Consumer / WE / Comm.</text>
</g>

<!-- MCC -->
<g>
  <rect x="143" y="15" width="78" height="26" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="182" y="25.99" text-anchor="middle" font-size="8" font-weight="bold">MCC</text>
  <text x="182" y="34.71" text-anchor="middle" font-size="7" fill="#5C647A">grocery / fuel / T&amp;E ...</text>
</g>

<!-- Режим ввода POS -->
<g>
  <rect x="222.5" y="15" width="82" height="26" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="263.5" y="25.99" text-anchor="middle" font-size="8" font-weight="bold">Режим ввода POS</text>
  <text x="263.5" y="34.71" text-anchor="middle" font-size="7" fill="#5C647A">CP / CNP / Contactless</text>
</g>

<!-- Качество данных -->
<g>
  <rect x="306" y="15" width="77" height="26" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="344.5" y="25.99" text-anchor="middle" font-size="8" font-weight="bold">Качество данных</text>
  <text x="344.5" y="34.71" text-anchor="middle" font-size="7" fill="#5C647A">на сигналах</text>
</g>
<g>
  <line x1="182" y1="41.5" x2="182" y2="61.5" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="187" y="54" font-size="7" fill="#5C647A">комбинированная оценка</text>
</g>

<!-- Подбор программы -->
<g>
  <rect x="72" y="62" width="220" height="28" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="182" y="73.99" text-anchor="middle" font-size="8" font-weight="bold">Подбор программы interchange</text>
  <text x="182" y="82.71" text-anchor="middle" font-size="7" fill="#5C647A">region x product x MCC x channel x signals x token</text>
</g>
<g>
  <line x1="122" y1="90.5" x2="89" y2="117.5" stroke="#2F8B67" stroke-width="1" marker-end="url(#arr-Good)"/>
  <text x="97" y="106" text-anchor="end" font-size="8">OK</text>
</g>
<g>
  <line x1="242" y1="90.5" x2="230" y2="117.5" stroke="#C15462" stroke-width="1" marker-end="url(#arr-Bad)"/>
  <text x="255" y="101" font-size="7" fill="#5C647A">сигналы</text>
  <text x="255" y="109" font-size="7" fill="#5C647A">ниже порога</text>
</g>

<!-- Qualified Rate -->
<g>
  <rect x="2" y="118" width="150" height="28" rx="3" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="77" y="134.24" text-anchor="middle" font-size="8" font-weight="bold">Qualified Rate</text>
</g>

<!-- Downgrade -->
<g>
  <rect x="170" y="118" width="213" height="64" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="276.5" y="129" text-anchor="middle" font-size="8" font-weight="bold">Downgrade (ступенчатая категория)</text>
  <line x1="176" y1="133.5" x2="377" y2="133.5" stroke="#C15462" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="176" y="143" font-size="8">— Mid-Qualified</text>
  <text x="176" y="153" font-size="8">— EIRF (Electronic Interchange Reimbursement Fee)</text>
  <text x="176" y="163" font-size="8">— Standard Rate</text>
  <text x="176" y="173" font-size="8">— Non-Qualified</text>
</g>

</g>
</svg>
