<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 134" width="385pt" height="134pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Ось времени -->
<g>
  <line x1="4" y1="104" x2="382" y2="104" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="383" y="100" text-anchor="end" font-size="7" fill="#5C647A">время</text>
</g>

<!-- auth -->
<g>
  <rect x="2" y="4" width="72" height="38" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="38" y="15" text-anchor="middle" font-size="8" font-weight="bold">Покупка</text>
  <text x="38" y="25" text-anchor="middle" font-size="7" fill="#5C647A">transaction</text>
  <text x="38" y="36" text-anchor="middle" font-size="8">EUR</text>
  <line x1="38" y1="42" x2="38" y2="100" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <circle cx="38" cy="104" r="4" fill="#5C647A"/>
  <text x="38" y="119" text-anchor="middle" font-size="8" font-weight="bold">auth</text>
  <text x="38" y="128" text-anchor="middle" font-size="7" fill="#5C647A">T0</text>
</g>

<!-- clearing -->
<g>
  <text x="116" y="19" text-anchor="middle" font-size="8" font-weight="bold">Списание (billing)</text>
  <text x="116" y="30" text-anchor="middle" font-size="8">EUR</text>
  <line x1="116" y1="34" x2="116" y2="100" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <circle cx="116" cy="104" r="3.5" fill="#ffffff" stroke="#5C647A" stroke-width="1"/>
  <text x="116" y="119" text-anchor="middle" font-size="8">clearing</text>
  <text x="116" y="128" text-anchor="middle" font-size="7" fill="#5C647A">часы (batch конца дня)</text>
</g>

<!-- settlement -->
<g>
  <rect x="160" y="4" width="72" height="38" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="196" y="15" text-anchor="middle" font-size="8" font-weight="bold">Расчёт</text>
  <text x="196" y="25" text-anchor="middle" font-size="7" fill="#5C647A">settlement</text>
  <text x="196" y="36" text-anchor="middle" font-size="8">USD</text>
  <line x1="196" y1="42" x2="196" y2="100" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <circle cx="196" cy="104" r="4" fill="#5C647A"/>
  <text x="196" y="119" text-anchor="middle" font-size="8" font-weight="bold">settlement</text>
  <text x="196" y="128" text-anchor="middle" font-size="7" fill="#5C647A">T+1..T+N</text>
</g>

<!-- payout -->
<g>
  <rect x="294" y="4" width="72" height="38" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="330" y="15" text-anchor="middle" font-size="8" font-weight="bold">Выплата</text>
  <text x="330" y="25" text-anchor="middle" font-size="7" fill="#5C647A">payout / ТСП</text>
  <text x="330" y="36" text-anchor="middle" font-size="8">GBP</text>
  <line x1="330" y1="42" x2="330" y2="100" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <circle cx="330" cy="104" r="4" fill="#5C647A"/>
  <text x="330" y="119" text-anchor="middle" font-size="8" font-weight="bold">payout</text>
  <text x="330" y="128" text-anchor="middle" font-size="7" fill="#5C647A">дни-недели</text>
</g>

<!-- EUR → USD -->
<g>
  <line x1="122" y1="72" x2="189" y2="72" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="155.5" y="67" text-anchor="middle" font-size="8">EUR → USD</text>
  <text x="155.5" y="82" text-anchor="middle" font-size="7" fill="#5C647A">(clearing)</text>
</g>

<!-- USD → GBP -->
<g>
  <line x1="203" y1="72" x2="323" y2="72" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="263" y="67" text-anchor="middle" font-size="8">USD → GBP</text>
  <text x="263" y="82" text-anchor="middle" font-size="7" fill="#5C647A">(payout)</text>
</g>

</g>
</svg>
