<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 188" width="385pt" height="188pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Транзакция и ось -->
<g>
  <rect x="2" y="79" width="88" height="28" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="46" y="96" text-anchor="middle" font-size="8" font-weight="bold">Транзакция #1042</text>
</g>
<line x1="90" y1="93" x2="105" y2="93" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
<line x1="106" y1="2" x2="106" y2="186" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>

<!-- Страница оплаты: 100 EUR (transaction) -->
<g>
  <rect x="118" y="2" width="265" height="18" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="250.5" y="14" text-anchor="middle" font-size="8">Страница оплаты: 100 EUR (transaction)</text>
</g>

<!-- Авторизация: 100 EUR -->
<g>
  <rect x="118" y="24" width="265" height="18" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="250.5" y="36" text-anchor="middle" font-size="8">Авторизация: 100 EUR</text>
</g>

<!-- Расчёт: 108 USD (settlement, EUR→USD @ 1,08) -->
<g>
  <rect x="118" y="46" width="265" height="18" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="250.5" y="58" text-anchor="middle" font-size="8">Расчёт: 108 USD (settlement, EUR→USD @ 1,08)</text>
</g>

<!-- Нетто-выплата: 100,44 USD -->
<g>
  <rect x="118" y="144" width="265" height="18" rx="3" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="250.5" y="156" text-anchor="middle" font-size="8">Нетто-выплата: 100,44 USD</text>
</g>

<!-- Счёт продавца: 79,35 GBP (USD→GBP @ 0,79) -->
<g>
  <rect x="118" y="166" width="265" height="18" rx="3" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="250.5" y="178" text-anchor="middle" font-size="8">Счёт продавца: 79,35 GBP (USD→GBP @ 0,79)</text>
</g>

<!-- Удержания -->
<g>
  <rect x="118" y="68" width="265" height="72" rx="3" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.75"/>
  <text x="126" y="81" font-size="8">interchange (1,5%)</text>
  <text x="375" y="81" text-anchor="end" font-size="8">−1,62 USD</text>
  <text x="126" y="92" font-size="8">assessment / scheme fee</text>
  <text x="375" y="92" text-anchor="end" font-size="8" fill="#5C647A">входит в эквайера</text>
  <text x="126" y="103" font-size="8">эквайер (2,5%)</text>
  <text x="375" y="103" text-anchor="end" font-size="8">−2,70 USD</text>
  <text x="126" y="114" font-size="8">комиссия платформы (3%)</text>
  <text x="375" y="114" text-anchor="end" font-size="8">−3,24 USD</text>
  <line x1="126" y1="121" x2="375" y2="121" stroke="#5C647A" stroke-width="0.5"/>
  <text x="126" y="132" font-size="8" font-weight="bold">итого удержаний</text>
  <text x="375" y="132" text-anchor="end" font-size="8" font-weight="bold">−7,56 USD</text>
</g>

</g>
</svg>
