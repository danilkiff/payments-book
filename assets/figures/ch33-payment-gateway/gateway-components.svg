<path d="M248.0,209.0 L258.0,209.0 L258.0,230 L271,230" fill="none" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>

<!-- ТСП -> API gateway -->
<line x1="100" y1="26" x2="100" y2="67" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>

