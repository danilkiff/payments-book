  <text x="338" y="142" text-anchor="middle" font-size="8">4 500 + 500 руб.</text>
</g>
<g>
  <text x="8" y="167" font-size="8" font-weight="bold">Расчёт</text>
  <rect x="82" y="155" width="96" height="18" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="130" y="167" text-anchor="middle" font-size="8">merchant_earned</text>
  <line x1="178" y1="164" x2="195" y2="164" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <rect x="196" y="155" width="96" height="18" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="244" y="167" text-anchor="middle" font-size="8">merchant_available</text>
  <text x="338" y="167" text-anchor="middle" font-size="8">4 500 руб.</text>
</g>
<g>
  <text x="8" y="188" font-size="8" font-weight="bold">Частич. возврат</text>
  <rect x="82" y="176" width="96" height="18" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="130" y="188" text-anchor="middle" font-size="8">merchant_available</text>
  <line x1="178" y1="185" x2="195" y2="185" stroke="#C15462" stroke-width="1" marker-end="url(#arr-Bad)"/>
  <rect x="196" y="176" width="96" height="18" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="244" y="188" text-anchor="middle" font-size="8">refund_payable</text>
  <text x="338" y="188" text-anchor="middle" font-size="8">2 000 руб.</text>
</g>
<line x1="192" y1="199" x2="192" y2="207" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>

<!-- Бухучёт банка -->
<g>
  <rect x="2" y="208" width="381" height="52" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.5"/>
  <text x="8" y="221" font-size="9" font-weight="bold">Бухучёт банка (809-П)</text>
</g>
<g>
  <rect x="8" y="228" width="70.03" height="26" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="43.02" y="239" text-anchor="middle" font-size="8" font-weight="bold">30233</text>
  <text x="43.02" y="249" text-anchor="middle" font-size="7" fill="#5C647A">расчёты с сетью</text>
</g>
<g>
  <rect x="94.45" y="228" width="101.73" height="26" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="145.32" y="239" text-anchor="middle" font-size="8" font-weight="bold">47422</text>
  <text x="145.32" y="249" text-anchor="middle" font-size="7" fill="#5C647A">обязательство перед ТСП</text>
</g>
<g>
  <rect x="212.61" y="228" width="81.45" height="26" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="253.34" y="239" text-anchor="middle" font-size="8" font-weight="bold">40702</text>
  <text x="253.34" y="249" text-anchor="middle" font-size="7" fill="#5C647A">счёт юр. лица (ТСП)</text>
</g>
<g>
  <rect x="310.48" y="228" width="66.52" height="26" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="343.74" y="239" text-anchor="middle" font-size="8" font-weight="bold">70601</text>
  <text x="343.74" y="249" text-anchor="middle" font-size="7" fill="#5C647A">операц. доходы</text>
