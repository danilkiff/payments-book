  <text x="325" y="31" text-anchor="middle" font-size="7" fill="#5C647A">день 5</text>
</g>

<!-- Шлюз -->
<g>
  <rect x="2" y="38" width="381" height="26" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.5"/>
  <text x="8" y="54" font-size="9" font-weight="bold">Шлюз</text>
  <rect x="70" y="42" width="290" height="18" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="215" y="54" text-anchor="middle" font-size="8" font-weight="bold">payment.status = succeeded</text>
</g>
<line x1="192" y1="64" x2="192" y2="73" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>

<!-- Продуктовый реестр -->
<g>
