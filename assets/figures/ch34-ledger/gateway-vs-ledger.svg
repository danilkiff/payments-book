  <text x="130" y="142" text-anchor="middle" font-size="8">merchant_pending</text>
  <line x1="178" y1="139" x2="195" y2="139" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <rect x="196" y="126" width="96" height="26" rx="3" fill="#ffffff" stroke="#5C647A" stroke-width="0.75"/>
  <text x="244" y="137.5" text-anchor="middle" font-size="8">merchant_earned +</text>
