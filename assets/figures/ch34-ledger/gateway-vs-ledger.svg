  <text x="8" y="100" font-size="7" font-weight="bold" fill="#5C647A">событие</text>
  <text x="130" y="100" text-anchor="middle" font-size="7" font-weight="bold" fill="#5C647A">Дебет</text>
  <text x="244" y="100" text-anchor="middle" font-size="7" font-weight="bold" fill="#5C647A">Кредит</text>
  <text x="338" y="100" text-anchor="middle" font-size="7" font-weight="bold" fill="#5C647A">Сумма</text>
</g>
<g>
  <text x="8" y="117" font-size="8" font-weight="bold">Auth</text>
