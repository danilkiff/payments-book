<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 262" width="385pt" height="262pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
  <marker id="arr-Bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C15462"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Шкала времени -->
<line x1="8" y1="19" x2="380" y2="19" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
<g>
  <text x="50" y="11" text-anchor="middle" font-size="8" font-weight="bold">Auth</text>
  <circle cx="50" cy="19" r="3" fill="#5C647A"/>
  <text x="50" y="31" text-anchor="middle" font-size="7" fill="#5C647A">день 0</text>
</g>
<g>
  <text x="140" y="11" text-anchor="middle" font-size="8" font-weight="bold">Подтверждение</text>
  <circle cx="140" cy="19" r="3" fill="#5C647A"/>
  <text x="140" y="31" text-anchor="middle" font-size="7" fill="#5C647A">день 0 + 30 мин</text>
</g>
<g>
  <text x="235" y="11" text-anchor="middle" font-size="8" font-weight="bold">Расчёт</text>
  <circle cx="235" cy="19" r="3" fill="#2F8B67"/>
  <text x="235" y="31" text-anchor="middle" font-size="7" fill="#5C647A">день 2</text>
</g>
<g>
