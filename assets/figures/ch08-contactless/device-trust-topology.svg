  <text x="31.5" text-anchor="middle" y="143" font-size="7" fill="#5C647A">iOS и др. ОС</text>
</g>
<g>
  <rect x="61" y="114" width="63" height="34" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
