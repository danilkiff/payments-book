<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 162" width="176pt" height="162pt">
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">
<!-- Физический -->
<g>
  <rect x="2" y="2" width="172" height="32" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="88" y="13" text-anchor="middle" font-size="8" font-weight="bold">Физический</text>
  <text x="88" y="22" text-anchor="middle" font-size="7" fill="#5C647A">13,56 МГц · ISO 14443-1 (механика)</text>
  <text x="88" y="31" text-anchor="middle" font-size="7" fill="#5C647A">ISO 14443-2 (РЧ-сигнал, ASK)</text>
</g>
<!-- Канальный -->
<g>
  <rect x="2" y="38" width="172" height="23" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="88" y="49" text-anchor="middle" font-size="8" font-weight="bold">Канальный</text>
  <text x="88" y="58" text-anchor="middle" font-size="7" fill="#5C647A">ISO 14443-3 · антиколлизия</text>
</g>
<!-- Транспорт -->
<g>
  <rect x="2" y="65" width="172" height="23" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="88" y="76" text-anchor="middle" font-size="8" font-weight="bold">Транспорт</text>
  <text x="88" y="85" text-anchor="middle" font-size="7" fill="#5C647A">ISO 14443-4 · T=CL (передача блоков)</text>
</g>
<!-- APDU -->
<g>
  <rect x="2" y="92" width="172" height="32" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="88" y="103" text-anchor="middle" font-size="8" font-weight="bold">APDU</text>
  <text x="88" y="112" text-anchor="middle" font-size="7" fill="#5C647A">ISO/IEC 7816-4</text>
  <text x="88" y="121" text-anchor="middle" font-size="7" fill="#5C647A">SELECT / GPO / READ RECORD / GENERATE AC</text>
</g>
<!-- Приложение -->
<g>
  <rect x="2" y="128" width="172" height="32" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="88" y="139" text-anchor="middle" font-size="8" font-weight="bold">Приложение</text>
  <text x="88" y="148" text-anchor="middle" font-size="7" fill="#5C647A">EMV Contactless Kernel</text>
  <text x="88" y="157" text-anchor="middle" font-size="7" fill="#5C647A">qVSDC / M/Chip / Мир</text>
</g>
</g>
</svg>
