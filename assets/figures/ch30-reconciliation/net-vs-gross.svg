<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 186" width="385pt" height="186pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<g>
  <text x="192.5" y="11" text-anchor="middle" font-size="9" font-weight="bold">Gross vs Net: что именно сворачивается за день</text>
</g>

<!-- Gross -->
<g>
  <rect x="2" y="18" width="148" height="14" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="76" y="28" text-anchor="middle" font-size="8" font-weight="bold">Gross</text>
</g>
<g>
  <rect x="2" y="36" width="148" height="148" rx="3" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.5"/>
  <text x="10" y="46" font-size="7" fill="#5C647A">сумма</text>
  <text x="60" y="46" font-size="7" fill="#5C647A">тип операции</text>
  <line x1="6" y1="49" x2="146" y2="49" stroke="#5C647A" stroke-width="0.5"/>
  <rect x="6" y="52" width="140" height="11" rx="3" fill="#2F8B67" fill-opacity="0.15"/>
  <text x="10" y="60.5" font-size="8" font-weight="bold">+100 ₽</text>
  <text x="60" y="60.5" font-size="8">покупка</text>
  <rect x="6" y="64" width="140" height="11" rx="3" fill="#2F8B67" fill-opacity="0.15"/>
  <text x="10" y="72.5" font-size="8" font-weight="bold">+250 ₽</text>
  <text x="60" y="72.5" font-size="8">покупка</text>
  <rect x="6" y="76" width="140" height="11" rx="3" fill="#B8821C" fill-opacity="0.18"/>
  <text x="10" y="84.5" font-size="8" font-weight="bold">−50 ₽</text>
  <text x="60" y="84.5" font-size="8">возврат</text>
  <rect x="6" y="88" width="140" height="11" rx="3" fill="#2F8B67" fill-opacity="0.15"/>
  <text x="10" y="96.5" font-size="8" font-weight="bold">+80 ₽</text>
  <text x="60" y="96.5" font-size="8">покупка</text>
  <rect x="6" y="100" width="140" height="11" rx="3" fill="#E8ECF7"/>
  <text x="10" y="108.5" font-size="8" font-weight="bold">−15 ₽</text>
  <text x="60" y="108.5" font-size="8">эквайер-комиссия</text>
  <rect x="6" y="112" width="140" height="11" rx="3" fill="#2F8B67" fill-opacity="0.15"/>
  <text x="10" y="120.5" font-size="8" font-weight="bold">+200 ₽</text>
  <text x="60" y="120.5" font-size="8">покупка</text>
  <rect x="6" y="124" width="140" height="11" rx="3" fill="#C15462" fill-opacity="0.15"/>
  <text x="10" y="132.5" font-size="8" font-weight="bold">−40 ₽</text>
  <text x="60" y="132.5" font-size="8">chargeback</text>
  <rect x="6" y="136" width="140" height="11" rx="3" fill="#2F8B67" fill-opacity="0.15"/>
  <text x="10" y="144.5" font-size="8" font-weight="bold">+95 ₽</text>
  <text x="60" y="144.5" font-size="8">покупка</text>
  <text x="10" y="160" font-size="8" font-weight="bold" fill="#5C647A">…</text>
  <text x="26" y="160" font-size="7" fill="#5C647A">всего ~100 операций/день</text>
  <line x1="6" y1="166" x2="146" y2="166" stroke="#5C647A" stroke-width="0.5"/>
  <text x="76" y="178" text-anchor="middle" font-size="8" font-weight="bold">× N переводов</text>
</g>

<!-- Свёртка -->
<g>
  <line x1="154" y1="100" x2="231" y2="100" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="192.5" y="95" text-anchor="middle" font-size="8" font-weight="bold">свёртка по дню</text>
  <text x="192.5" y="110" text-anchor="middle" font-size="7" fill="#5C647A">(T или T+1)</text>
</g>

<!-- Net -->
<g>
  <rect x="235" y="18" width="148" height="14" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="309" y="28" text-anchor="middle" font-size="8" font-weight="bold">Net</text>
</g>
<g>
  <rect x="250" y="36" width="118" height="70" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="309" y="68" text-anchor="middle" font-size="8" font-weight="bold">покупки</text>
  <text x="309" y="79" text-anchor="middle" font-size="8" font-weight="bold">+725 ₽</text>
</g>
<g>
  <rect x="250" y="106" width="118" height="13" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="256" y="115.5" font-size="8">возвраты</text>
  <text x="362" y="115.5" text-anchor="end" font-size="8" font-weight="bold">−50 ₽</text>
</g>
<g>
  <rect x="250" y="119" width="118" height="12" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="256" y="128.0" font-size="8">комиссии</text>
  <text x="362" y="128.0" text-anchor="end" font-size="8" font-weight="bold">−15 ₽</text>
</g>
<g>
  <rect x="250" y="131" width="118" height="14" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="256" y="141.0" font-size="8">chargeback</text>
  <text x="362" y="141.0" text-anchor="end" font-size="8" font-weight="bold">−40 ₽</text>
</g>
<g>
  <rect x="235" y="152" width="148" height="18" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="309" y="164" text-anchor="middle" font-size="8" font-weight="bold">= 620 ₽ (1 позиция)</text>
</g>

</g>
</svg>
