<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 230" width="385pt" height="230pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Рабочая зона FPR 2-10 % -->
<rect x="102" y="8" width="272" height="160" fill="#E8ECF7"/>

<!-- Сетка и оси -->
<g>
  <line x1="34" y1="128" x2="374" y2="128" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="34" y1="88" x2="374" y2="88" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="34" y1="48" x2="374" y2="48" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="34" y1="8" x2="374" y2="8" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="102" y1="8" x2="102" y2="168" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="204" y1="8" x2="204" y2="168" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <path d="M34,8 V168 H374" fill="none" stroke="#5C647A" stroke-width="0.5"/>
  <text x="31" y="170.5" text-anchor="end" font-size="7" fill="#5C647A">0%</text>
  <text x="31" y="130.5" text-anchor="end" font-size="7" fill="#5C647A">25%</text>
  <text x="31" y="90.5" text-anchor="end" font-size="7" fill="#5C647A">50%</text>
  <text x="31" y="50.5" text-anchor="end" font-size="7" fill="#5C647A">75%</text>
  <text x="31" y="10.5" text-anchor="end" font-size="7" fill="#5C647A">100%</text>
  <text x="34" y="177" text-anchor="middle" font-size="7" fill="#5C647A">0%</text>
  <text x="102" y="177" text-anchor="middle" font-size="7" fill="#5C647A">2%</text>
  <text x="204" y="177" text-anchor="middle" font-size="7" fill="#5C647A">5%</text>
  <text x="374" y="177" text-anchor="middle" font-size="7" fill="#5C647A">10%</text>
  <text x="204" y="187" text-anchor="middle" font-size="8" font-weight="bold">FPR</text>
  <text x="0" y="0" font-size="8" font-weight="bold" transform="translate(8,95.9) rotate(-90)">TPR</text>
</g>

<!-- Случайный классификатор: TPR = FPR -->
<g>
  <line x1="34" y1="168" x2="374" y2="152" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="372" y="148" text-anchor="end" font-size="7" fill="#5C647A">случайный</text>
</g>

<!-- ROC-кривая -->
<path d="M34,168 C38.6,150.2 43.2,88 51,56 C61.6,38.2 86.8,30.2 102,27.6 C181,22.2 272.9,14.7 374,11.1" fill="none" stroke="#5C647A" stroke-width="1"/>

<!-- Переход порога 75 -> 65 -->
<line x1="54" y1="54" x2="99" y2="29.2" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>

<!-- Рабочая точка: порог 75, Block -->
<g>
  <circle cx="51" cy="56" r="3.5" fill="#C15462" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="56" y="60" width="70.9" height="20" fill="#FFFFFF"/>
  <text x="58" y="67" font-size="8" font-weight="bold">порог 75</text>
  <text x="58" y="76" font-size="7" fill="#5C647A">TPR 70%, FPR 0,5%</text>
</g>
<!-- Рабочая точка: порог 65, 3DS step-up -->
<g>
  <circle cx="102" cy="27.2" r="3.5" fill="#B8821C" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="108" y="34.2" width="65.2" height="20" fill="#FFFFFF"/>
  <text x="110" y="41.2" font-size="8" font-weight="bold">порог 65</text>
  <text x="110" y="50.2" font-size="7" fill="#5C647A">TPR 88%, FPR 2%</text>
</g>

<g>
  <rect x="2" y="202" width="123" height="26" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="63.5" y="214" text-anchor="middle" font-size="8" font-weight="bold">Block</text>
  <text x="63.5" y="223" text-anchor="middle" font-size="7" fill="#5C647A">score ≥ 75</text>
</g>
<g>
  <rect x="131" y="202" width="123" height="26" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="192.5" y="214" text-anchor="middle" font-size="8" font-weight="bold">3DS step-up</text>
  <text x="192.5" y="223" text-anchor="middle" font-size="7" fill="#5C647A">65 ≤ score &lt; 75</text>
</g>
<g>
  <rect x="260" y="202" width="123" height="26" rx="3" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="321.5" y="214" text-anchor="middle" font-size="8" font-weight="bold">Pass</text>
  <text x="321.5" y="223" text-anchor="middle" font-size="7" fill="#5C647A">score &lt; 65</text>
</g>

</g>
</svg>
