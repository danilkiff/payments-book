  <text x="355" y="17" text-anchor="middle" font-size="8" font-weight="bold">Эмитент</text>
</g>

<!-- VisaNet -->
<g>
  <rect x="106" y="2" width="173" height="120" rx="3" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.5"/>
  <text x="192.5" y="15" text-anchor="middle" font-size="9" font-weight="bold">VisaNet</text>
</g>
<text x="192.5" y="27" text-anchor="middle" font-size="7" fill="#5C647A">V.I.P. System: BASE I (авторизация)</text>
<g>
  <rect x="114" y="34" width="47" height="22" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="137.5" y="48" text-anchor="middle" font-size="8" font-weight="bold">VIC</text>
</g>
<g>
  <rect x="169" y="34" width="47" height="22" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="192.5" y="48" text-anchor="middle" font-size="8" font-weight="bold">STIP</text>
</g>
<g>
  <rect x="224" y="34" width="47" height="22" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="247.5" y="48" text-anchor="middle" font-size="8" font-weight="bold">VAA</text>
</g>
<line x1="114" y1="68" x2="271" y2="68" stroke="#5C647A" stroke-width="0.5"/>
<text x="192.5" y="81" text-anchor="middle" font-size="7" fill="#5C647A">BASE II (клиринг)</text>
