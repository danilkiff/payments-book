<g>
  <line x1="272" y1="99" x2="326" y2="99" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="303" y="95" text-anchor="middle" font-size="7" fill="#5C647A">TC 33.A,</text>
  <text x="303" y="108" text-anchor="middle" font-size="7" fill="#5C647A">T+0/T+1</text>
