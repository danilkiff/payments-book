  <rect x="114" y="88" width="157" height="22" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="192.5" y="102" text-anchor="middle" font-size="8" font-weight="bold">VSS</text>
</g>

<!-- Авторизация 0100/0110 -->
<g>
  <line x1="59" y1="45" x2="113" y2="45" stroke="#5C647A" stroke-width="1" marker-start="url(#arr-Muted-s)" marker-end="url(#arr-Muted)"/>
  <text x="82" y="41" text-anchor="middle" font-size="7" fill="#5C647A">0100&lt;-&gt;0110</text>
  <text x="82" y="54" text-anchor="middle" font-size="7" fill="#5C647A">через VIC</text>
</g>
<g>
  <line x1="272" y1="45" x2="326" y2="45" stroke="#5C647A" stroke-width="1" marker-start="url(#arr-Muted-s)" marker-end="url(#arr-Muted)"/>
  <text x="303" y="41" text-anchor="middle" font-size="7" fill="#5C647A">0100&lt;-&gt;0110</text>
</g>

<!-- Клиринг TC 33.A -->
<g>
  <line x1="59" y1="99" x2="113" y2="99" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="82" y="95" text-anchor="middle" font-size="7" fill="#5C647A">TC 33.A,</text>
  <text x="82" y="108" text-anchor="middle" font-size="7" fill="#5C647A">T+0/T+1</text>
