<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" width="330pt" height="230pt">
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Общий ИТ-периметр: вне области оценки -->
<g>
  <ellipse cx="165" cy="115" rx="163" ry="113" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.5"/>
  <text x="165" y="20" text-anchor="middle" font-size="9" font-weight="bold">вне области оценки</text>
</g>

<!-- Единая зона in-scope-but-not-CDE: connected-to и security-impacting без строгого разделения -->
<g>
  <ellipse cx="165" cy="115" rx="120" ry="82" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="165" y="51" text-anchor="middle" font-size="8" font-weight="bold">влияющие на безопасность</text>
  <text x="165" y="60" text-anchor="middle" font-size="7" fill="#5C647A">(security-impacting)</text>
  <text x="165" y="176" text-anchor="middle" font-size="8" font-weight="bold">связанные</text>
  <text x="165" y="185" text-anchor="middle" font-size="7" fill="#5C647A">(connected-to)</text>
</g>

<!-- CDE -->
<g>
  <ellipse cx="165" cy="115" rx="62" ry="40" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75" stroke-dasharray="3,2"/>
  <text x="165" y="101" text-anchor="middle" font-size="9" font-weight="bold">CDE</text>
</g>

<!-- Запрет хранения SAD внутри CDE -->
<g>
  <rect x="135" y="107" width="60" height="24" rx="3" fill="#ffffff" stroke="#C15462" stroke-width="0.75" stroke-dasharray="3,2"/>
  <text x="165" y="117" text-anchor="middle" font-size="8" font-weight="bold">SAD</text>
  <text x="165" y="127" text-anchor="middle" font-size="8" font-weight="bold">не хранить</text>
</g>

</g>
</svg>
