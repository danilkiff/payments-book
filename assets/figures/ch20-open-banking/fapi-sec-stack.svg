<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 138" width="385pt" height="138pt">
<defs>
  <marker id="arr-AccentA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4E63D9"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Стандарт ФАПИ.СЕК -->
<g>
  <rect x="2" y="2" width="234" height="134" rx="3" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="8" y="14" font-size="9" font-weight="bold">СТО БР ФАПИ.СЕК-1.6-2024</text>
</g>
<g>
  <rect x="8" y="32" width="109" height="44" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="62.5" y="45" text-anchor="middle" font-size="8">Криптография в JOSE</text>
  <text x="62.5" y="55" text-anchor="middle" font-size="8">(JWS / JWE / JWT / JWK)</text>
  <text x="62.5" y="65" text-anchor="middle" font-size="8">и в подписи запросов</text>
</g>
<g>
  <rect x="123" y="32" width="107" height="44" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="176.5" y="45" text-anchor="middle" font-size="8">Транспортный слой:</text>
  <text x="176.5" y="55" text-anchor="middle" font-size="8">взаимный TLS</text>
  <text x="176.5" y="65" text-anchor="middle" font-size="8">на сертификатах X.509</text>
</g>
<g>
  <rect x="8" y="84" width="222" height="20" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="119" y="97" text-anchor="middle" font-size="8">FAPI 1.0 Advanced  +  JARM</text>
</g>
<g>
  <rect x="8" y="110" width="222" height="20" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="119" y="123" text-anchor="middle" font-size="8">OAuth 2.0  +  OpenID Connect Core</text>
</g>

<!-- Отечественная криптография -->
<g>
  <rect x="244" y="8" width="139" height="40" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="313.5" y="20" text-anchor="middle" font-size="8">ГОСТ-криптография в JOSE:</text>
  <text x="313.5" y="30" text-anchor="middle" font-size="8">34.10 (подпись), 34.11 «Стрибог»,</text>
  <text x="313.5" y="40" text-anchor="middle" font-size="8">34.12 «Кузнечик» / «Магма»</text>
</g>
<g>
  <rect x="244" y="56" width="139" height="20" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="313.5" y="69" text-anchor="middle" font-size="8">ГОСТ TLS</text>
</g>
<path d="M244,23 L62.5,23 L62.5,31" fill="none" stroke="#4E63D9" stroke-width="1" marker-end="url(#arr-AccentA)"/>
<line x1="244" y1="66" x2="231" y2="66" stroke="#4E63D9" stroke-width="1" marker-end="url(#arr-AccentA)"/>

</g>
</svg>
