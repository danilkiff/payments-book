<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 76" width="364pt" height="76pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
  <marker id="arr-Good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F8B67"/></marker>
  <marker id="arr-Bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C15462"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Начальное состояние -->
<g>
  <circle cx="8" cy="18" r="3.5" fill="#5C647A"/>
  <line x1="11.5" y1="18" x2="21" y2="18" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
</g>

<!-- Состояния -->
<g>
  <rect x="22" y="8" width="96" height="20" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="70" y="21" text-anchor="middle" font-size="8">AwaitingAuthorisation</text>
</g>
<g>
  <rect x="190" y="8" width="56" height="20" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="218" y="21" text-anchor="middle" font-size="8">Authorised</text>
</g>
<g>
  <rect x="304" y="8" width="56" height="20" rx="3" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="332" y="21" text-anchor="middle" font-size="8">Consumed</text>
</g>
<g>
  <rect x="45" y="52" width="50" height="20" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="70" y="65" text-anchor="middle" font-size="8">Rejected</text>
</g>

<!-- Переходы -->
<g>
  <line x1="118" y1="18" x2="189" y2="18" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="153.5" y="15" text-anchor="middle" font-size="7" fill="#5C647A">PSU подтверждает</text>
</g>
<g>
  <line x1="246" y1="18" x2="303" y2="18" stroke="#2F8B67" stroke-width="1" marker-end="url(#arr-Good)"/>
  <text x="274.5" y="15" text-anchor="middle" font-size="7" fill="#5C647A">платёж создан</text>
</g>
<g>
  <line x1="70" y1="28" x2="70" y2="51" stroke="#C15462" stroke-width="1" marker-end="url(#arr-Bad)"/>
  <text x="75" y="43" font-size="7" fill="#5C647A">PSU отклоняет или ASPSP не принял</text>
</g>

</g>
</svg>
