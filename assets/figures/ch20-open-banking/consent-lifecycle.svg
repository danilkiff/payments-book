<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 112" width="364pt" height="112pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
  <marker id="arr-Good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F8B67"/></marker>
  <marker id="arr-Warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B8821C"/></marker>
  <marker id="arr-Bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C15462"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Начальное состояние -->
<g>
  <circle cx="8" cy="18" r="3.5" fill="#5C647A"/>
  <line x1="11.5" y1="18" x2="21" y2="18" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
</g>

<!-- Состояния -->
<g>
  <rect x="22" y="8" width="96" height="20" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="70" y="21" text-anchor="middle" font-size="8">AwaitingAuthorisation</text>
</g>
<g>
  <rect x="250" y="8" width="56" height="20" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="278" y="21" text-anchor="middle" font-size="8">Authorised</text>
</g>
<g>
  <rect x="6" y="88" width="50" height="20" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="31" y="101" text-anchor="middle" font-size="8">Rejected</text>
</g>
<g>
  <rect x="90" y="88" width="56" height="20" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75" stroke-dasharray="3,2"/>
  <text x="118" y="101" text-anchor="middle" font-size="8">Deleted</text>
</g>
<g>
  <rect x="200" y="88" width="52" height="20" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="226" y="101" text-anchor="middle" font-size="8">Expired</text>
</g>
<g>
  <rect x="300" y="88" width="56" height="20" rx="3" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="328" y="101" text-anchor="middle" font-size="8">Consumed</text>
</g>

<!-- Переходы из AwaitingAuthorisation -->
<g>
  <line x1="118" y1="18" x2="249" y2="18" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="183.5" y="15" text-anchor="middle" font-size="7" fill="#5C647A">подтверждает</text>
</g>
<g>
  <line x1="36" y1="28" x2="31" y2="87" stroke="#C15462" stroke-width="1" marker-end="url(#arr-Bad)"/>
  <text x="38" y="64" font-size="7" fill="#5C647A">отклоняет</text>
</g>
<g>
  <line x1="70" y1="28" x2="116" y2="87" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Muted)"/>
  <text x="94" y="52" font-size="7" fill="#5C647A">DELETE</text>
</g>
<g>
  <line x1="100" y1="28" x2="222" y2="87" stroke="#B8821C" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Warn)"/>
  <text x="150" y="48" font-size="7" fill="#5C647A">таймаут</text>
</g>

<!-- Переходы из Authorised -->
<g>
  <line x1="266" y1="28" x2="232" y2="87" stroke="#B8821C" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Warn)"/>
  <text x="243" y="60" text-anchor="end" font-size="7" fill="#5C647A">истёк</text>
</g>
<g>
  <line x1="292" y1="28" x2="322" y2="87" stroke="#2F8B67" stroke-width="1" marker-end="url(#arr-Good)"/>
  <text x="313" y="60" font-size="7" fill="#5C647A">использовано</text>
</g>

</g>
</svg>
