<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 124" width="312pt" height="124pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
  <marker id="arr-Good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F8B67"/></marker>
  <marker id="arr-Warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B8821C"/></marker>
  <marker id="arr-Bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C15462"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Начальное состояние: создание согласия -->
<g>
  <circle cx="70" cy="6" r="3.5" fill="#5C647A"/>
  <line x1="70" y1="9.5" x2="70" y2="21" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="78" y="12" font-size="7" fill="#5C647A">POST /account-consents  (СПУ)</text>
</g>

<!-- Состояния -->
<g>
  <rect x="22" y="22" width="96" height="20" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="70" y="35" text-anchor="middle" font-size="8">AwaitingAuthorisation</text>
</g>
<g>
  <rect x="250" y="22" width="56" height="20" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="278" y="35" text-anchor="middle" font-size="8">Authorised</text>
</g>
<g>
  <rect x="45" y="100" width="50" height="20" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="70" y="113" text-anchor="middle" font-size="8">Rejected</text>
</g>
<g>
  <rect x="250" y="100" width="56" height="20" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="278" y="113" text-anchor="middle" font-size="8">Revoked</text>
</g>

<!-- Переходы из AwaitingAuthorisation -->
<g>
  <line x1="118" y1="32" x2="249" y2="32" stroke="#2F8B67" stroke-width="1" marker-end="url(#arr-Good)"/>
  <text x="183.5" y="29" text-anchor="middle" font-size="7" fill="#5C647A">Пользователь подтверждает</text>
</g>
<g>
  <line x1="70" y1="42" x2="70" y2="99" stroke="#C15462" stroke-width="1" marker-end="url(#arr-Bad)"/>
  <text x="75" y="74" font-size="7" fill="#5C647A">Пользователь отклоняет</text>
</g>

<!-- Переход из Authorised -->
<g>
  <line x1="278" y1="42" x2="278" y2="99" stroke="#B8821C" stroke-width="1" marker-end="url(#arr-Warn)"/>
  <text x="283" y="74" font-size="7" fill="#5C647A">DELETE</text>
</g>

</g>
</svg>
