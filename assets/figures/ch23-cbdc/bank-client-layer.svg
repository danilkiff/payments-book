  <text x="8" y="160" font-size="7" fill="#5C647A">248-ФЗ · тариф ЦБ</text>
</g>
<g>
  <rect x="8" y="63" width="98" height="24" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="57" y="74" text-anchor="middle" font-size="8" font-weight="bold">Идентификация</text>
  <text x="57" y="83" text-anchor="middle" font-size="7" fill="#5C647A">115-ФЗ</text>
</g>
<g>
  <rect x="112" y="63" width="98" height="24" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="161" y="73.5" text-anchor="middle" font-size="8" font-weight="bold">Подпись и</text>
  <text x="161" y="82.5" text-anchor="middle" font-size="8" font-weight="bold">авторизация</text>
</g>
<g>
  <rect x="8" y="94" width="98" height="24" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="57" y="105" text-anchor="middle" font-size="8" font-weight="bold">ПОД/ФТ/ФРОМУ</text>
  <text x="57" y="114" text-anchor="middle" font-size="7" fill="#5C647A">валютный контроль</text>
</g>
<g>
  <rect x="112" y="94" width="98" height="24" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="161" y="105" text-anchor="middle" font-size="8" font-weight="bold">Антифрод</text>
  <text x="161" y="114" text-anchor="middle" font-size="7" fill="#5C647A">лимиты · реквизиты</text>
</g>
<g>
  <rect x="8" y="125" width="98" height="24" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="57" y="136" text-anchor="middle" font-size="8" font-weight="bold">Ввод/вывод</text>
  <text x="57" y="145" text-anchor="middle" font-size="7" fill="#5C647A">счёт · кошелёк</text>
</g>
<g>
  <rect x="112" y="125" width="98" height="24" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="161" y="136" text-anchor="middle" font-size="8" font-weight="bold">Приём</text>
  <text x="161" y="145" text-anchor="middle" font-size="7" fill="#5C647A">универсальный QR · НСПК</text>
</g>

<!-- Банк -> платформа -->
<g>
  <line x1="216" y1="106" x2="261" y2="106" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="239" y="102" text-anchor="middle" font-size="7" fill="#5C647A">на расчёт</text>
</g>

<!-- Платформа Банка России -->
<g>
  <rect x="262" y="30" width="121" height="134" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.5"/>
  <text x="322.5" y="42" text-anchor="middle" font-size="9" font-weight="bold">Платформа</text>
  <text x="322.5" y="52" text-anchor="middle" font-size="9" font-weight="bold">Банка России</text>
  <text x="322.5" y="61" text-anchor="middle" font-size="7" fill="#5C647A">хранение · расчёт · эмиссия</text>
  <text x="322.5" y="157" text-anchor="middle" font-size="7" fill="#5C647A">обязательство Банка России</text>
</g>
<g>
  <rect x="268" y="68" width="109" height="20" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="322.5" y="81" text-anchor="middle" font-size="8" font-weight="bold">Кошелёк · реестр</text>
</g>
<g>
  <rect x="268" y="96" width="109" height="20" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="322.5" y="109" text-anchor="middle" font-size="8" font-weight="bold">Расчётный движок</text>
</g>
<g>
  <rect x="268" y="124" width="109" height="20" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="322.5" y="137" text-anchor="middle" font-size="8" font-weight="bold">Эмиссия</text>
</g>

</g>
</svg>
