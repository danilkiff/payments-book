<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 166" width="385pt" height="166pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Клиент -->
<g>
  <rect x="20" y="2" width="60" height="18" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="50" y="14" text-anchor="middle" font-size="8" font-weight="bold">Клиент</text>
</g>

<!-- Прямого доступа клиента к платформе нет -->
<g>
  <path d="M81,11 H322.5 V29" fill="none" stroke="#C15462" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="197.2" y1="7" x2="205.2" y2="15" stroke="#C15462" stroke-width="1"/>
  <line x1="205.2" y1="7" x2="197.2" y2="15" stroke="#C15462" stroke-width="1"/>
  <text x="201.2" y="25" text-anchor="middle" font-size="7" fill="#C15462">прямого доступа нет</text>
</g>

<!-- Клиент -> банк: ДБО -->
<g>
  <line x1="50" y1="20" x2="50" y2="43" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="55" y="35" font-size="7" font-weight="bold" fill="#5C647A">ДБО</text>
</g>

<!-- Банк-участник -->
<g>
  <rect x="2" y="44" width="214" height="120" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.5"/>
