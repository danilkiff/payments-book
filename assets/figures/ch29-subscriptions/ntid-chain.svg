<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 144" width="385pt" height="144pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Цепочка CIT -> MIT -->
<g>
  <rect x="7.5" y="2" width="70" height="20" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="42.5" y="15" text-anchor="middle" font-size="8" font-weight="bold">CIT</text>
  <text x="42.5" y="32" text-anchor="middle" font-size="7" fill="#5C647A">NTID создан</text>
  <text x="42.5" y="41" text-anchor="middle" font-size="7">123456789012345</text>
</g>
<g>
  <line x1="77.5" y1="12" x2="106.5" y2="12" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
</g>
<g>
  <rect x="107.5" y="2" width="70" height="20" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="142.5" y="15" text-anchor="middle" font-size="8" font-weight="bold">MIT₁</text>
  <text x="142.5" y="32" text-anchor="middle" font-size="7" fill="#5C647A">NTID ref</text>
  <text x="142.5" y="41" text-anchor="middle" font-size="7">123456789012345</text>
</g>
<g>
  <line x1="177.5" y1="12" x2="206.5" y2="12" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
</g>
<g>
  <rect x="207.5" y="2" width="70" height="20" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="242.5" y="15" text-anchor="middle" font-size="8" font-weight="bold">MIT₂</text>
  <text x="242.5" y="32" text-anchor="middle" font-size="7" fill="#5C647A">NTID ref</text>
  <text x="242.5" y="41" text-anchor="middle" font-size="7">123456789012345</text>
</g>
<g>
  <line x1="277.5" y1="12" x2="306.5" y2="12" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
</g>
<g>
  <rect x="307.5" y="2" width="70" height="20" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="342.5" y="15" text-anchor="middle" font-size="8" font-weight="bold">MIT₃</text>
  <text x="342.5" y="32" text-anchor="middle" font-size="7" fill="#5C647A">NTID ref</text>
  <text x="342.5" y="41" text-anchor="middle" font-size="7">123456789012345</text>
</g>

<!-- Visa -->
<g>
  <rect x="2" y="50" width="188" height="92" rx="3" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.5"/>
  <text x="96" y="63" text-anchor="middle" font-size="9" font-weight="bold">Visa: NTID</text>
  <text x="8" y="78" font-size="7" font-weight="bold" fill="#5C647A">Поле ISO 8583</text>
  <text x="74" y="78" font-size="8">DE 62.2, до 15 цифр</text>
  <text x="8" y="89" font-size="7" font-weight="bold" fill="#5C647A">Генератор</text>
  <text x="74" y="89" font-size="8">VisaNet, возврат</text>
  <text x="74" y="98" font-size="8">в auth response</text>
  <text x="8" y="109" font-size="7" font-weight="bold" fill="#5C647A">Пример</text>
  <text x="74" y="109" font-size="8">123456789012345</text>
  <text x="8" y="124" font-size="7" font-weight="bold" fill="#5C647A">POS Environment</text>
  <text x="74" y="124" font-size="8">DE 60.8</text>
  <text x="8" y="135" font-size="7" font-weight="bold" fill="#5C647A">POS Entry Mode</text>
  <text x="74" y="135" font-size="8">10 (CoF)</text>
</g>

<!-- Mastercard -->
<g>
  <rect x="195" y="50" width="188" height="92" rx="3" fill="#F5F7FD" stroke="#5C647A" stroke-width="0.5"/>
  <text x="289" y="63" text-anchor="middle" font-size="9" font-weight="bold">Mastercard: Trace ID (с 2026 TLID)</text>
  <text x="201" y="78" font-size="7" font-weight="bold" fill="#5C647A">Поле ISO 8583</text>
  <text x="267" y="78" font-size="8">DE 48 SE 63</text>
  <text x="201" y="89" font-size="7" font-weight="bold" fill="#5C647A">Длина</text>
  <text x="267" y="89" font-size="8">15 символов (фиксировано)</text>
  <text x="201" y="109" font-size="7" font-weight="bold" fill="#5C647A">Пример</text>
  <text x="267" y="109" font-size="8">MCCABC1230327</text>
  <text x="201" y="124" font-size="7" font-weight="bold" fill="#5C647A">POS Entry Mode</text>
  <text x="267" y="124" font-size="8">10 (CoF)</text>
</g>

</g>
</svg>
