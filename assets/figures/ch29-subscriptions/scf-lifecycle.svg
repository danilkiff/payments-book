<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 128" width="385pt" height="128pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
  <marker id="arr-Bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C15462"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- 3DS / SCA только при CIT -->
<g>
  <rect x="2" y="2" width="90" height="14" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="47" y="12" text-anchor="middle" font-size="8" font-weight="bold">3DS / SCA (EEA, UK)</text>
</g>

<!-- События над шкалой -->
<g>
  <rect x="2" y="20" width="90" height="36" rx="3" fill="#4E63D9" fill-opacity="0.15" stroke="#4E63D9" stroke-width="0.75"/>
  <text x="47" y="30" text-anchor="middle" font-size="8" font-weight="bold">CIT</text>
  <text x="47" y="41" text-anchor="middle" font-size="7" fill="#5C647A">initial transaction</text>
  <text x="47" y="50" text-anchor="middle" font-size="7" fill="#5C647A">согласие + выдача NTID</text>
</g>
<g>
  <rect x="99" y="20" width="90" height="36" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="144" y="30" text-anchor="middle" font-size="8" font-weight="bold">MIT₁</text>
  <text x="144" y="41" text-anchor="middle" font-size="7" fill="#5C647A">subsequent · recurring</text>
  <text x="144" y="50" text-anchor="middle" font-size="7" fill="#5C647A">NTID ref → CIT</text>
</g>
<g>
  <rect x="196" y="20" width="90" height="36" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="241" y="30" text-anchor="middle" font-size="8" font-weight="bold">MIT₂</text>
  <text x="241" y="41" text-anchor="middle" font-size="7" fill="#5C647A">subsequent · recurring</text>
  <text x="241" y="50" text-anchor="middle" font-size="7" fill="#5C647A">NTID ref → CIT</text>
</g>
<g>
  <rect x="293" y="20" width="90" height="36" rx="3" fill="#7759D6" fill-opacity="0.15" stroke="#7759D6" stroke-width="0.75"/>
  <text x="338" y="30" text-anchor="middle" font-size="8" font-weight="bold">MIT₃</text>
  <text x="338" y="41" text-anchor="middle" font-size="7" fill="#5C647A">subsequent · recurring</text>
  <text x="338" y="50" text-anchor="middle" font-size="7" fill="#5C647A">NTID ref → CIT</text>
</g>

<!-- Шкала времени -->
<g>
  <line x1="2" y1="70" x2="382" y2="70" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <line x1="47" y1="66" x2="47" y2="74" stroke="#5C647A" stroke-width="1"/>
  <text x="47" y="84" text-anchor="middle" font-size="8" font-weight="bold">T₀</text>
  <line x1="144" y1="66" x2="144" y2="74" stroke="#5C647A" stroke-width="1"/>
  <text x="144" y="84" text-anchor="middle" font-size="8" font-weight="bold">T + 30 дн</text>
  <line x1="241" y1="66" x2="241" y2="74" stroke="#5C647A" stroke-width="1"/>
  <text x="241" y="84" text-anchor="middle" font-size="8" font-weight="bold">T + 60 дн</text>
  <line x1="338" y1="66" x2="338" y2="74" stroke="#5C647A" stroke-width="1"/>
  <text x="338" y="84" text-anchor="middle" font-size="8" font-weight="bold">T + 90 дн</text>
  <text x="383" y="84" text-anchor="end" font-size="7" fill="#5C647A">время</text>
</g>

<!-- Отказ при MIT без NTID -->
<g>
  <line x1="144" y1="89" x2="144" y2="107" stroke="#C15462" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-Bad)"/>
  <text x="150" y="100" font-size="7" fill="#5C647A">если MIT без NTID ref или с неверным типом:</text>
</g>
<g>
  <rect x="99" y="108" width="110" height="18" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="154" y="120" text-anchor="middle" font-size="8" font-weight="bold">decline или soft decline</text>
</g>

</g>
</svg>
