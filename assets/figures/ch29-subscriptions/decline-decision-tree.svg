<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 192" width="385pt" height="192pt">
<defs>
  <marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker>
  <marker id="arr-Good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F8B67"/></marker>
  <marker id="arr-Warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B8821C"/></marker>
  <marker id="arr-Bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C15462"/></marker>
</defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Корень: отказ по MIT -->
<g>
  <rect x="185" y="2" width="90" height="24" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="230" y="13" text-anchor="middle" font-size="8" font-weight="bold">Отказ по MIT</text>
  <text x="230" y="22" text-anchor="middle" font-size="7" fill="#5C647A">регулярное списание</text>
</g>
<g>
  <line x1="230" y1="26" x2="230" y2="39" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
</g>

<!-- Условие 1: код отказа -->
<g>
  <polygon points="230,40 280,58 230,76 180,58" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="230" y="61" text-anchor="middle" font-size="8" font-weight="bold">Код отказа?</text>
</g>

<!-- Ветвь: код требует аутентификации -->
<g>
  <line x1="180" y1="58" x2="105" y2="58" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="142.5" y="46" text-anchor="middle" font-size="7" fill="#5C647A">код требует</text>
  <text x="142.5" y="54" text-anchor="middle" font-size="7" fill="#5C647A">аутентификации</text>
</g>
<g>
  <rect x="2" y="44" width="102" height="34" rx="3" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="53" y="55" text-anchor="middle" font-size="8" font-weight="bold">Вернуть клиента</text>
  <text x="53" y="64" text-anchor="middle" font-size="8" font-weight="bold">в 3DS / SCA</text>
  <text x="53" y="73" text-anchor="middle" font-size="7" fill="#5C647A">ту же MIT не повторять</text>
</g>

<!-- Ветвь: код допускает повтор -->
<g>
  <line x1="230" y1="76" x2="230" y2="95" stroke="#5C647A" stroke-width="1" marker-end="url(#arr-Muted)"/>
  <text x="235" y="89" font-size="7" fill="#5C647A">код допускает повтор</text>
</g>

<!-- Условие 2: классификатор MAC -->
<g>
  <polygon points="230,96 300,116 230,136 160,116" fill="#E8ECF7" stroke="#5C647A" stroke-width="0.75"/>
  <text x="230" y="115" text-anchor="middle" font-size="8" font-weight="bold">Классификатор MAC</text>
  <text x="230" y="124" text-anchor="middle" font-size="7" fill="#5C647A">DE 48</text>
</g>

<!-- MAC 03 / незнакомый: STOP -->
<g>
  <path d="M160,116 H76 V163" fill="none" stroke="#C15462" stroke-width="1" marker-end="url(#arr-Bad)"/>
  <text x="118" y="111" text-anchor="middle" font-size="7" fill="#5C647A">MAC 03 / незнакомый</text>
</g>
<g>
  <rect x="2" y="164" width="148" height="26" rx="3" fill="#C15462" fill-opacity="0.15" stroke="#C15462" stroke-width="0.75"/>
  <text x="76" y="175" text-anchor="middle" font-size="8" font-weight="bold">STOP</text>
  <text x="76" y="184" text-anchor="middle" font-size="7" fill="#5C647A">повторы прекратить</text>
</g>

<!-- MAC 01: UPDATE -->
<g>
  <line x1="230" y1="136" x2="230" y2="163" stroke="#B8821C" stroke-width="1" marker-end="url(#arr-Warn)"/>
  <text x="235" y="152" font-size="7" fill="#5C647A">MAC 01</text>
</g>
<g>
  <rect x="172" y="164" width="116" height="26" rx="3" fill="#B8821C" fill-opacity="0.18" stroke="#B8821C" stroke-width="0.75"/>
  <text x="230" y="175" text-anchor="middle" font-size="8" font-weight="bold">UPDATE</text>
  <text x="230" y="184" text-anchor="middle" font-size="7" fill="#5C647A">реквизиты через ABU / VAU</text>
</g>

<!-- MAC 24-30: WAIT -->
<g>
  <path d="M300,116 H339.5 V163" fill="none" stroke="#2F8B67" stroke-width="1" marker-end="url(#arr-Good)"/>
  <text x="321" y="111" text-anchor="middle" font-size="7" fill="#5C647A">MAC 24–30</text>
</g>
<g>
  <rect x="296" y="164" width="87" height="26" rx="3" fill="#2F8B67" fill-opacity="0.15" stroke="#2F8B67" stroke-width="0.75"/>
  <text x="339.5" y="175" text-anchor="middle" font-size="8" font-weight="bold">WAIT</text>
  <text x="339.5" y="184" text-anchor="middle" font-size="7" fill="#5C647A">повтор через интервал</text>
</g>

</g>
</svg>
