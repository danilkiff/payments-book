<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 146" width="300pt" height="146pt">
<defs><marker id="arr-Muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5C647A"/></marker></defs>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" fill="#1A2030">

<!-- Зоны: смещённый отбор (Soft), всегда онлайн (Panel) -->
<rect x="116" y="18" width="100" height="102" fill="#F5F7FD"/>
<rect x="216" y="18" width="70" height="102" fill="#E8ECF7"/>

<!-- Оси -->
<g>
<line x1="46" y1="124" x2="46" y2="6" stroke="#5C647A" stroke-width="0.75" marker-end="url(#arr-Muted)"/>
<line x1="42" y1="120" x2="296" y2="120" stroke="#5C647A" stroke-width="0.75" marker-end="url(#arr-Muted)"/>
<text x="42" y="10" text-anchor="end" font-size="8" font-weight="bold">P(онлайн)</text>
<text x="296" y="142" text-anchor="end" font-size="8" font-weight="bold">сумма транзакции</text>
</g>

<!-- Деления -->
<g>
<line x1="43" y1="18" x2="46" y2="18" stroke="#5C647A" stroke-width="0.5"/>
<text x="41" y="21" text-anchor="end" font-size="8">100%</text>
<line x1="43" y1="70" x2="46" y2="70" stroke="#5C647A" stroke-width="0.5"/>
<text x="41" y="73" text-anchor="end" font-size="8">MTPBRS</text>
<line x1="43" y1="106" x2="46" y2="106" stroke="#5C647A" stroke-width="0.5"/>
<text x="41" y="109" text-anchor="end" font-size="8">TPRS</text>
<line x1="46" y1="120" x2="46" y2="123" stroke="#5C647A" stroke-width="0.5"/>
<text x="46" y="131" text-anchor="middle" font-size="8">0</text>
<line x1="116" y1="120" x2="116" y2="123" stroke="#5C647A" stroke-width="0.5"/>
<text x="116" y="131" text-anchor="middle" font-size="8">TVBRS</text>
<line x1="216" y1="120" x2="216" y2="123" stroke="#5C647A" stroke-width="0.5"/>
<text x="216" y="131" text-anchor="middle" font-size="8">floor limit</text>
</g>

<!-- Кривая P(онлайн) -->
<g>
<line x1="46" y1="106" x2="116" y2="106" stroke="#5C647A" stroke-width="1"/>
<line x1="116" y1="106" x2="216" y2="70" stroke="#5C647A" stroke-width="1"/>
<line x1="216" y1="70" x2="216" y2="18" stroke="#5C647A" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="216" y1="18" x2="286" y2="18" stroke="#5C647A" stroke-width="1"/>
</g>

<!-- Подписи зон -->
<g>
<text x="81" y="101" text-anchor="middle" font-size="7" fill="#5C647A">случайный отбор</text>
<text x="170" y="114" text-anchor="middle" font-size="7" fill="#5C647A">смещённый случайный</text>
<text x="251" y="13" text-anchor="middle" font-size="7" fill="#5C647A">всегда онлайн</text>
</g>
</g>
</svg>
